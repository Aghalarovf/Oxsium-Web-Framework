<div class="mode-toggle">
  <button class="mode-btn active">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
      <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.3"/>
      <path d="M2 8h12M8 2c-2 2-3 4-3 6s1 4 3 6" stroke="currentColor" stroke-width="1.2"/>
    </svg>
    Single Target
  </button>
  <button class="mode-btn">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
      <path d="M2 4h12M2 8h10M2 12h8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    </svg>
    Bulk / List
  </button>
  <button class="mode-btn">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
      <rect x="2" y="3" width="12" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
      <path d="M5 7h6M5 10h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    </svg>
    From File
  </button>
</div>

<div class="connect-card">
  <div class="card-title">Target Information</div>

  <!-- Row 1: Domain Name (sol) + Target URL (sağ) -->
  <div class="form-row" style="grid-template-columns:1fr 1.6fr;">
    <div class="form-group" style="min-width:0;">
      <label class="form-label">Domain Name</label>
      <input class="form-input" id="input-domain" type="text"
             placeholder="example.com" spellcheck="false" style="width:100%;">
    </div>
    <div class="form-group" style="min-width:0;">
      <label class="form-label">
        Target URL
        <span style="opacity:.5;font-weight:400;">(Optional)</span>
      </label>
      <input class="form-input" id="input-target-url" type="text"
             placeholder="https://target.com" spellcheck="false" style="width:100%;">
    </div>
  </div>

  <div class="form-row" style="grid-template-columns:1fr 1fr;">
    <div class="form-group" style="min-width:0;">
      <label class="form-label">
        VHOST
        <span style="opacity:.5;font-weight:400;">(Optional)</span>
      </label>
      <input class="form-input" id="input-vhost" type="text"
             placeholder="internal.example.com" spellcheck="false" style="width:100%;">
    </div>
    <div class="form-group" style="min-width:0;">
      <label class="form-label">Port</label>
      <input class="form-input" id="input-port" type="text"
             placeholder="443" spellcheck="false" style="width:100%;">
    </div>
  </div>

  <div class="form-row single">
    <div class="form-group">
      <label class="form-label">
        Custom Headers
        <span style="opacity:.5;font-weight:400;">(Optional)</span>
      </label>
      <textarea class="form-textarea" id="input-headers"
                placeholder="Authorization: Bearer eyJ...&#10;X-Custom-Header: value"></textarea>
    </div>
  </div>

  <div class="form-row single">
    <div class="form-group">
      <label class="form-label">
        Proxy
        <span style="opacity:.5;font-weight:400;">(Optional)</span>
      </label>
      <input class="form-input" id="input-proxy" type="text"
             placeholder="http://127.0.0.1:8080" spellcheck="false">
    </div>
  </div>
</div>

<div class="connect-card">
  <div class="card-title">Protocol &amp; Transport</div>
  <div class="protocol-grid">
    <button class="proto-btn selected">
      <span class="proto-name">HTTP / HTTPS</span>
      <span class="proto-port">80 / 443</span>
    </button>
    <button class="proto-btn"
            style="opacity:0.45;cursor:not-allowed;pointer-events:none;">
      <span class="proto-name">WS / WSS</span>
      <span class="proto-port" style="font-size:9px;opacity:0.7;">Soon</span>
    </button>
  </div>
</div>

<div class="action-row">
  <button id="ts-start-btn" class="btn-primary">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
      <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.4"/>
      <path d="M11 11l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    START SCAN
  </button>
  <button id="ts-stop-btn" class="btn-danger">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
      <rect x="4" y="4" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.4"/>
    </svg>
    STOP
  </button>
  <button class="btn-secondary">
    <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
      <path d="M7 2v5l3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.3"/>
    </svg>
    History
  </button>
  <button class="btn-secondary">
    <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
      <rect x="2" y="2" width="10" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
      <path d="M7 5v4M5 7l2 2 2-2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Export
  </button>
  <button id="ts-load-db-btn" class="btn-load-db" style="width:auto;margin-top:0;">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="M8 2v8M5 7l3 3 3-3M3 12.5h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Load From Database
  </button>
</div>
