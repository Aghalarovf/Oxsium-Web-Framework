<div class="mode-toggle">
  <button class="mode-btn active">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.3"/><path d="M2 8h12M8 2c-2 2-3 4-3 6s1 4 3 6" stroke="currentColor" stroke-width="1.2"/></svg>
    Single Target
  </button>
  <button class="mode-btn">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h10M2 12h8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
    Bulk / List
  </button>
  <button class="mode-btn">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="12" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M5 7h6M5 10h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
    From File
  </button>
</div>

<div class="connect-card">
  <div class="card-title">Target Information</div>
  <div class="form-row single">
    <div class="form-group">
      <label class="form-label">Domain Name</label>
      <input class="form-input" id="input-domain" type="text" placeholder="example.com" spellcheck="false" style="width:100%;">
    </div>
  </div>
  <div class="form-row" style="grid-template-columns:1fr 1fr;">
    <div class="form-group">
      <label class="form-label">Threads</label>
      <div class="dns-threads-group" id="target-threads-group">
        <button type="button" class="dns-thread-btn" data-val="1">1</button>
        <button type="button" class="dns-thread-btn" data-val="2">2</button>
        <button type="button" class="dns-thread-btn dns-thread-btn-active" data-val="3">3</button>
        <button type="button" class="dns-thread-btn" data-val="4">4</button>
        <button type="button" class="dns-thread-btn" data-val="5">5</button>
      </div>
      <label class="form-label" style="margin-top:12px;">Options</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;padding-top:2px;">
        <label class="check-toggle">
          <input type="checkbox" id="target-opt-takeover">
          <span class="check-box"></span>
          <span class="check-label">Check subdomain takeover</span>
        </label>
        <label class="check-toggle">
          <input type="checkbox" id="target-opt-check-live">
          <span class="check-box"></span>
          <span class="check-label">Check Live (HTTP probe)</span>
        </label>
        <label class="check-toggle">
          <input type="checkbox" id="target-opt-resolve">
          <span class="check-box"></span>
          <span class="check-label">Resolve DNS</span>
        </label>
        <label class="check-toggle">
          <input type="checkbox" id="target-opt-wildcard-filter">
          <span class="check-box"></span>
          <span class="check-label">Wildcard Filter</span>
        </label>
        <label class="check-toggle">
          <input type="checkbox" id="target-opt-dns-security" checked>
          <span class="check-box"></span>
          <span class="check-label">Mail DNS Security</span>
        </label>
        <label class="check-toggle">
          <input type="checkbox" id="target-opt-service-scanner" checked>
          <span class="check-box"></span>
          <span class="check-label">Service Scanner</span>
        </label>
        <label class="check-toggle">
          <input type="checkbox" id="target-opt-exchange" checked>
          <span class="check-box"></span>
          <span class="check-label">Exchange Endpoints</span>
        </label>
        <label class="check-toggle">
          <input type="checkbox" id="target-opt-ntlm">
          <span class="check-box"></span>
          <span class="check-label">NTLM Reconnaissance</span>
        </label>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Intercept Logs <span style="opacity:.45;font-weight:400;">.json / .jsonl</span></label>
      <div style="display:flex;gap:8px;">
        <input class="form-input" id="input-intercept" type="text" placeholder="/path/to/intercept.jsonl" spellcheck="false" style="flex:1;">
        <button type="button" class="btn-secondary" id="target-browse-btn">Browse</button>
        <input type="file" id="target-intercept-file" accept=".json,.jsonl" hidden>
      </div>
      <div style="margin-top:5px;color:var(--text-dim);font-size:10px;">Path to a captured traffic log</div>
    </div>
  </div>
</div>

<div class="connect-card">
  <div class="card-title">Protocol &amp; Transport</div>
  <div class="protocol-grid">
    <button class="proto-btn selected"><span class="proto-name">HTTP / HTTPS</span><span class="proto-port">80 / 443</span></button>
    <button class="proto-btn" style="opacity:0.45;cursor:not-allowed;pointer-events:none;"><span class="proto-name">WS / WSS</span><span class="proto-port" style="font-size:9px;opacity:0.7;">Soon</span></button>
  </div>
</div>

<div class="action-row">
  <button id="ts-start-btn" class="btn-primary"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.4"/><path d="M11 11l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>START SCAN</button>
  <button id="ts-stop-btn" class="btn-danger"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="4" y="4" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.4"/></svg>STOP</button>
  <button id="ts-reset-btn" class="btn-secondary" style="height:auto;align-self:stretch;padding:0 16px;" title="Reset"><svg width="20" height="20" viewBox="0 0 16 16" fill="none"><path d="M3 8a5 5 0 1 0 5-5 5 5 0 0 0-3.54 1.46L3 3M3 3v3h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div>
<button id="ts-load-db-btn" class="btn-load-db"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M8 2v8M5 7l3 3 3-3M3 12.5h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Load From Database</button>
